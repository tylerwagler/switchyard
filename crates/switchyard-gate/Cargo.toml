[package]
name = "switchyard-gate"
version.workspace = true
description = "API-key authentication, quotas, and usage metering in front of switchyard-server"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http.workspace = true
humantime = "2.4"
parking_lot.workspace = true
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde_json.workspace = true
sha2 = "0.11"
switchyard-protocol.workspace = true
switchyard-server.workspace = true
tokio.workspace = true
tokio-postgres = "0.7"
tracing.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
